<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e5dfd0">
<title>Mac OS 9.0 — Web Clone</title>
<meta name="description" content="A recreation of the October 1999 Mac OS 9.0 desktop on a Power Macintosh G4 (Yikes!): Sherlock 2 channels, Multiple Users, Keychain, Software Update and the Platinum appearance on an 800×600 screen beside a 10 GB hard disk, a Zip 100 disk and a CD-ROM, rebuilt for the web.">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="../../css/mac-os-9/mac.css">
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../assets/icons/favicon.svg">
</head>
<body>
  <div id="stage">
    <div id="screen" aria-label="Macintosh screen">
      <div id="desk">
        <div id="menubar" role="menubar"></div>
        <div id="desktop"></div>
        <div id="windows"></div>
        <div id="marquee" hidden></div>
        <div id="dragghost" hidden></div>
        <div id="menus"></div>
        <div id="dialogs"></div>
      </div>

      <div id="boot" class="boot">
        <div class="boot-inner">
          <canvas id="boot-face" class="boot-face" width="128" height="128"></canvas>
          <div class="boot-msg" id="boot-msg">Welcome to Macintosh. Click to start up.</div>
          <div class="boot-exts" id="boot-exts"></div>
          <div class="boot-sub">Mac OS 9.0 &middot; Finder 9.0 &middot; 1999</div>
        </div>
      </div>
    </div>
  </div>

  <div id="outside">
    <span><b>Mac OS 9.0</b> — web clone. Click the screen to start. <kbd>Esc</kbd> closes menus &middot; <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+key for shortcuts.</span>
    <a class="back-to-launcher" href="../../">&#8592; All systems</a>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
