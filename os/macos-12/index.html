<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181c">
<title>macOS Monterey 12 — Web Clone</title>
<meta name="description" content="A recreation of the 2021 macOS Monterey desktop on a MacBook Pro (14-inch, M1 Pro): Focus modes, Shortcuts, Safari tab groups and the rounded design, rebuilt for the web.">
<link rel="stylesheet" href="../../css/macos-12/mac.css">
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="stage">
    <div id="screen" aria-label="Macintosh screen">
      <div id="menubar" role="menubar"></div>
      <div id="desktop"></div>
      <div id="dock"></div>
      <div id="controlcenter" class="panel"></div>
      <div id="notifcenter" class="panel"></div>
      <div id="windows"></div>
      <div id="dialogs"></div>
      <div id="boot" class="boot">
        <div class="boot-inner">
          <div class="boot-apple"></div>
          <div class="boot-bar"><i></i></div>
          <div class="boot-msg">Click to start up.</div>
          <div class="boot-sub">macOS Monterey 12 &middot; MacBook Pro (14-inch, M1 Pro, 2021)</div>
        </div>
      </div>
    </div>
  </div>

  <div id="outside">
    <span><b>macOS Monterey 12</b> — web clone. Click the screen to start. Try Focus in the Control Center and the Shortcuts app.</span>
    <a class="back-to-launcher" href="../../">&#8592; All systems</a>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
